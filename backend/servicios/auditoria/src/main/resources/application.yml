server:
  port: ${SERVER_PORT:8108}

spring:
  application:
    name: auditoria
  datasource:
    # Cada servicio tiene su propio esquema y usuario de BD (arquitectura del informe, punto 5.3.1.12).
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PUERTO:3306}/orvex_auditoria?useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:orvex_auditoria}
    password: ${DB_PASSWORD:orvex_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # el esquema lo controla Flyway, no Hibernate
  flyway:
    enabled: true
  rabbitmq:
    listener:
      simple:
        # 3 intentos por mensaje; si sigue fallando va a la cola de fallidos (no se pierde ni bloquea la cola).
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
        default-requeue-rejected: false

management:
  metrics:
    tags:
      servicio: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  servicio: auditoria
  descripcion: "Auditoría: registro de acciones críticas (M07)."

orvex:
  zona-horaria: ${ZONA_HORARIA:America/La_Paz}
