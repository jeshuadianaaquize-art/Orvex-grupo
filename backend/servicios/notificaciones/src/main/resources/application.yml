server:
  port: ${SERVER_PORT:8107}

spring:
  application:
    name: notificaciones
  datasource:
    # Cada servicio tiene su propio esquema y usuario de BD (arquitectura del informe, punto 5.3.1.12).
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PUERTO:3306}/orvex_notificaciones?useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:orvex_notificaciones}
    password: ${DB_PASSWORD:orvex_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # el esquema lo controla Flyway, no Hibernate
  flyway:
    enabled: true
  # Correo saliente. En desarrollo va a Mailpit: http://localhost:8025
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  rabbitmq:
    listener:
      simple:
        # 3 intentos por mensaje; si sigue fallando va a la cola de fallidos (no se pierde ni bloquea la cola).
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
        default-requeue-rejected: false

management:
  metrics:
    tags:
      servicio: ${spring.application.name}
  health:
    # El correo caído NO marca al servicio como caído
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  servicio: notificaciones
  descripcion: "Notificaciones: correos automáticos desde la cola de mensajes (M07)."

orvex:
  zona-horaria: ${ZONA_HORARIA:America/La_Paz}
  servicios:
    usuarios-url: ${USUARIOS_URL:http://localhost:8101}
  correo:
    remitente: ${CORREO_REMITENTE:Orvex <no-responder@orvex.local>}
  notificaciones:
    envio-ms: ${NOTIFICACIONES_ENVIO_MS:5000}
