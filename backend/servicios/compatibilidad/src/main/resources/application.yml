server:
  port: ${SERVER_PORT:8103}

spring:
  application:
    name: compatibilidad
  datasource:
    # Cada servicio tiene su propio esquema y usuario de BD (arquitectura del informe, punto 5.3.1.12).
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PUERTO:3306}/orvex_compatibilidad?useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:orvex_compatibilidad}
    password: ${DB_PASSWORD:orvex_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # el esquema lo controla Flyway, no Hibernate
  flyway:
    enabled: true

management:
  metrics:
    tags:
      servicio: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  servicio: compatibilidad
  descripcion: "Compatibilidad: armador de PC y verificación de reglas (M04)."

orvex:
  servicios:
    catalogo-url: ${CATALOGO_URL:http://localhost:8102}
