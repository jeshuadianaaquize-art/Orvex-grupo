# Prometheus (HU-25, RF-23)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: orvex
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8090"]
        labels: { servicio: gateway }
      - targets: ["usuarios:8101"]
        labels: { servicio: usuarios }
      - targets: ["catalogo:8102"]
        labels: { servicio: catalogo }
      - targets: ["compatibilidad:8103"]
        labels: { servicio: compatibilidad }
      - targets: ["optimizacion:8104"]
        labels: { servicio: optimizacion }
      - targets: ["inventario:8105"]
        labels: { servicio: inventario }
      - targets: ["pedidos-pagos:8106"]
        labels: { servicio: pedidos-pagos }
      - targets: ["notificaciones:8107"]
        labels: { servicio: notificaciones }
      - targets: ["auditoria:8108"]
        labels: { servicio: auditoria }
      - targets: ["reportes:8109"]
        labels: { servicio: reportes }
