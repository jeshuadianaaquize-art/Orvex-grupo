# Alertas propuestas (D51): umbrales para revisión del equipo, no medidos en producción.
groups:
  - name: orvex
    rules:
      - alert: ServicioCaido
        expr: up{job="orvex"} == 0
        for: 1m
        labels: { severidad: critica }
        annotations:
          resumen: "{{ $labels.servicio }} no responde"
          descripcion: "Prometheus no puede leer las métricas de {{ $labels.servicio }} hace más de 1 minuto."

      - alert: CircuitoAbierto
        expr: max by (servicio, name) (resilience4j_circuitbreaker_state{state="open"}) == 1
        for: 30s
        labels: { severidad: alta }
        annotations:
          resumen: "Circuito abierto: {{ $labels.servicio }} → {{ $labels.name }}"
          descripcion: "{{ $labels.servicio }} dejó de llamar a {{ $labels.name }} porque falló repetidamente. La función afectada responde 503."

      - alert: ErroresDelServidor
        expr: |
          sum by (servicio) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (servicio) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severidad: alta }
        annotations:
          resumen: "Más de 5 % de errores 5xx en {{ $labels.servicio }}"

      - alert: RespuestaLenta
        expr: |
          histogram_quantile(0.95, sum by (servicio, le) (rate(http_server_requests_seconds_bucket[5m]))) > 2
        for: 10m
        labels: { severidad: media }
        annotations:
          resumen: "p95 mayor a 2 s en {{ $labels.servicio }} (objetivo propuesto del informe)"

      - alert: MemoriaJvmAlta
        expr: sum by (servicio) (jvm_memory_used_bytes{area="heap"}) / sum by (servicio) (jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severidad: media }
        annotations:
          resumen: "{{ $labels.servicio }} usa más del 90 % de su memoria"
